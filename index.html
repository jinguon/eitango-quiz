.opt.ng{background:var(--ngbg);border-color:var(--acc)}
.res{font-size:3.4rem;font-weight:900;line-height:1.1;margin:6px 0}
.res small{font-size:1.2rem}

.list div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}

const CATS={w:{n:"単語",d:D},i:{n:"熟語",d:I},p:{n:"ことわざ",d:P}};
const DIRS=[["ej","英語→日本語"],["je","日本語→英語"]];
const CATN=[["w","単語"],["i","熟語"],["p","ことわざ"],["a","すべて"]];
const SEL={dir:"ej",cat:"w"};
const app=document.getElementById("app");
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let n,lives,used,wrong,cur,lock;
const bk=()=>"vq_"+SEL.dir+SEL.cat;
function getBest(){try{return +localStorage.getItem(bk())||0}catch(e){return 0}}
function tierOf(q){return q<=5?0:q<=10?1:q<=15?2:q<=25?3:4}
function pickIn(q,c){
const t=tierOf(q),d=CATS[c].d;
for(const k of [t,t+1,t+2,t+3,t+4,t-1,t-2,t-3,t-4]){
if(k<0||k>4)continue;
const pool=d[k].filter(w=>!used.has(c+w[0]));
if(pool.length)return {c:c,w:rnd(pool),k:k};
}
return null;
}
function pick(q){
for(const c of (SEL.cat==="a"?shuf(["w","i","p"]):[SEL.cat])){const r=pickIn(q,c);if(r)return r}
return null;
}
function home(){
const chips=(arr,key)=>arr.map(x=>'<button class="chip'+(SEL[key]===x[0]?' on':'')+'" data-k="'+key+'" data-v="'+x[0]+'">'+x[1]+'</button>').join('');
const b=getBest();
app.innerHTML='<h1>英単語問題</h1><div class="grp"><div class="gl">出題</div>'+chips(DIRS,"dir")+'</div><div class="grp"><div class="gl">内容</div>'+chips(CATN,"cat")+'</div><p class="sub">'+(b?'この設定の自己ベスト: '+b+'問目':'4択 / ライフ3つ / 問題数は無制限')+'</p><button class="go" id="st">スタート</button>';
app.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{SEL[c.dataset.k]=c.dataset.v;home()});
document.getElementById("st").onclick=start;
}
function start(){n=1;lives=3;used=new Set();wrong=[];ask()}
function ask(){
cur=pick(n);
if(!cur)return end(true);
used.add(cur.c+cur.w[0]);lock=false;
const a=SEL.dir==="ej"?1:0,p=1-a,all=CATS[cur.c].d;
const same=shuf(all[cur.k].filter(x=>x[a]!==cur.w[a])),rest=shuf(all.flat().filter(x=>x[a]!==cur.w[a]&&!all[cur.k].includes(x))),ds=[];
for(const x of [...same,...rest]){if(ds.length<3&&!ds.includes(x[a]))ds.push(x[a])}
cur.a=a;cur.o=shuf([cur.w[a],...ds]);
const q=cur.w[p],cls=(p===0&&q.length>16?" long":"")+(p===1?" jp":"");
app.innerHTML='<div class="top"><div class="q">第'+n+'問</div><div class="lives" aria-label="残りライフ '+lives+'">'+[0,1,2].map(i=>'<span class="'+(i<lives?'':'x')+'">♥</span>').join('')+'</div></div><div class="word'+cls+'">'+q+'</div>'+cur.o.map((o,i)=>'<button class="opt" data-i="'+i+'">'+o+'</button>').join('');
app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
}
function answer(i){
if(lock)return;lock=true;
const bs=app.querySelectorAll(".opt"),ok=cur.o[i]===cur.w[cur.a];
bs.forEach((b,j)=>{b.disabled=true;if(cur.o[j]===cur.w[cur.a])b.classList.add("ok")});
if(!ok){bs[i].classList.add("ng");lives--;wrong.push(cur.w)}
setTimeout(()=>{if(lives<=0)end(false);else{n++;ask()}},ok?650:1500);
}
function end(clear){
const reached=clear?n-1:n;let best=getBest();
if(reached>best){best=reached;try{localStorage.setItem(bk(),best)}catch(e){}}
app.innerHTML='<p class="sub" style="margin-top:10px">'+(clear?'全問クリア!':'ゲームオーバー')+'</p><div class="res">'+reached+'<small>問目まで到達</small></div><p class="sub">この設定の自己ベスト: '+best+'問目</p>'+(wrong.length?'<h2 style="font-size:1.1rem;margin:20px 0 0">間違えた問題</h2><div class="list">'+wrong.map(w=>'<div><b>'+w[0]+'</b><span>'+w[1]+'</span></div>').join('')+'</div>':'')+'<button class="go" id="rt">もう一度</button><button class="sec" id="hm">設定を変える</button>';
document.getElementById("rt").onclick=start;
document.getElementById("hm").onclick=home;
window.scrollTo(0,0);
}
home();
</script>
